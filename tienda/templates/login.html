{% extends 'base.html' %}

{% block title %}Iniciar Sesión - Skincare Shop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="login-container">
            <h2 class="text-center mb-4">Iniciar Sesión</h2>
            
            <form method="post" class="login-form">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario o Email:</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Ingresa tu usuario o email" required>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña:</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                </div>
                
                <button type="submit" class="btn btn-pink w-100 mb-3">Ingresar</button>
                
                <div class="text-center">
                    <a href="#" class="text-muted">¿Olvidaste tu Contraseña?</a>
                    <p class="mt-3">¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate aquí</a></p>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
